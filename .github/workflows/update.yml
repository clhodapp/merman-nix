# SPDX-License-Identifier: MIT
#
# Follows upstream without anyone bumping by hand. Three packages track
# three lines: merman-stable the newest stable tag, merman-preview the
# newest tag of any kind, merman-unstable the head of the main branch.
# Every run asks GitHub where each line stands and, for each package
# behind its line, moves it (version, source hash and cargo vendor
# hash, plus the commit for the snapshot, all rewritten by nix-update),
# proves the result with that package's smoke check, and commits the
# bump. The bumps that pass are pushed to main together; a package
# whose bump fails its check stays where it was, and the run fails
# after the push, naming it. The smoke check is the proof that matters:
# upstream is pre-1.0 and has changed what ships between tags in ways
# a successful build does not reveal.
#
# nix-update's default would skip every tag with "alpha" or "rc" in
# its name; `unstable` admits them for the preview line, and
# `branch=main` names the snapshot line.
#
# A push made with the workflow's own token starts no other workflow,
# so the two that a push to main would have started are dispatched at
# the end instead: check.yml, which builds main again, roots it in the
# build cache and pushes the closure to the clhodapp cache, and
# notify-workspace.yml, which asks the workspace to converge its
# consumers onto the new versions. A bump is built twice as a result,
# once here as the gate and once there as the publication; the second
# build keeps "what main builds is what the caches hold" a property of
# check.yml alone.
#
# A run that finds main moved under it (its push is refused as a
# non-fast-forward) fails and leaves the bumps to the next run.

name: update

on:
  schedule:
    # Daily, off the hour. A run with nothing to do installs Nix, reads
    # the feeds and stops, in about a minute.
    - cron: "37 6 * * *"
  workflow_dispatch:

# Pushing the bumps; dispatching check.yml and notify-workspace.yml.
permissions:
  contents: write
  actions: write

# Two runs at once could both find the same release and race to push.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Actions pinned by commit, as in check.yml.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      # nix-update comes from this flake's own nixpkgs pin, so the run
      # fetches nothing the lock does not name. It reads each package's
      # fetchFromGitHub source to find the feeds, and rewrites the
      # package file in place.
      - name: Move each package to where its line stands
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          moved=()
          failed=()
          for entry in merman-stable=stable merman-preview=unstable merman-unstable=branch=main; do
            package=${entry%%=*}
            line=${entry#*=}
            before=$(nix eval --raw ".#$package.version")
            nix run --inputs-from . 'nixpkgs#nix-update' -- --flake --version="$line" "$package"
            if git diff --quiet -- "pkgs/$package"; then
              echo "$package $before is where its line stands."
              continue
            fi
            after=$(nix eval --raw ".#$package.version")
            git diff -- "pkgs/$package"
            if nix build --print-build-logs --no-link ".#checks.x86_64-linux.smoke-$package"; then
              git commit -q -m "maint($package): $before -> $after" -- "pkgs/$package"
              moved+=("$package $after")
              echo "$package $before becomes $after."
            else
              git checkout -- "pkgs/$package"
              failed+=("$package $after")
              echo "::error::$package $after fails its smoke check; $before stays."
            fi
          done
          echo "moved=${moved[*]:-}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Push the bumps to main
        if: steps.bump.outputs.moved != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.bump.outputs.moved }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
          echo "::notice::Pushed to main: $MOVED."

      # Both take main's head as their subject: check.yml with no inputs
      # builds main's own commit, and notify-workspace.yml passes the
      # head of the ref it was dispatched on.
      - name: Start the runs the push would have started
        if: steps.bump.outputs.moved != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run notify-workspace.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Fail for the packages that could not move
        if: steps.bump.outputs.failed != ''
        env:
          FAILED: ${{ steps.bump.outputs.failed }}
        run: |
          echo "::error::Held back by a failing smoke check: $FAILED."
          exit 1
